<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FP-Growth Algorithm</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="upload-section">
            <h1>FP-Growth Algorithm</h1>
            <h2>Upload Transaction Data</h2>
            <div class="file-input-container">
                <label class="file-input-label">
                    Choose Excel File
                    <input type="file" id="fileInput" accept=".xlsx,.xls" />
                </label>
            </div>
            <span class="file-name" id="fileName">No file chosen</span>
        </div>

        <div class="parameters-section" id="parametersSection">
            <h2>FP-Growth Parameters</h2>
            <div class="input-group">
                <label for="minSupport">Minimum Support (%)</label>
                <input type="number" id="minSupport" min="0.01" max="100" step="1" value="40" />
            </div>
            <div class="input-group">
                <label for="minConfidence">Minimum Confidence (%)</label>
                <input type="number" id="minConfidence" min="0" max="100" step="1" value="60" />
            </div>
            <br />
            <button class="run-btn" id="runBtn" disabled>Run FP-Growth Algorithm</button>
        </div>

        <div class="results-section" id="resultsSection"></div>
    </div>

    <script src="js/data_formatter.js"></script>
    <script src="js/table_maker.js"></script>
    <script src="js/fpgrowth_functions.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
